plugins {
    id "java-library"
    id "jacoco"
    id "org.sonarqube" version "5.1.0.4882"
    id "maven-publish"
    id "signing"
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
    id "com.diffplug.spotless" version "6.25.0"
    id "me.qoomon.git-versioning" version "6.4.4"
    id "com.github.ben-manes.versions" version "0.51.0"
}

group = "io.github.stefanbratanov"

version = "develop"

gitVersioning.apply {
    refs {
        tag("v(?<version>.*)") {
            version = '${ref.version}'
        }
    }
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

def jacksonVersion = "2.19.0"
def junitVersion = "5.11.1"

dependencies {
    implementation("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonVersion}")
    api("com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}")

    testImplementation("org.junit.jupiter:junit-jupiter:${junitVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter-params:${junitVersion}")
    testImplementation("org.assertj:assertj-core:3.26.3")
    testImplementation("org.mock-server:mockserver-netty-no-dependencies:5.15.0")
    testImplementation("com.atlassian.oai:swagger-request-validator-core:2.42.0")
    testImplementation("org.skyscreamer:jsonassert:1.5.3")
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "jvm-openai"
                description = "A minimalistic OpenAI API client for the JVM, written in Java"
                url = "https://github.com/StefanBratanov/jvm-openai"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "StefanBratanov"
                        name = "Stefan Bratanov"
                        email = "stefan.bratanov93@gmail.com"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/StefanBratanov/jvm-openai.git"
                    developerConnection = "scm:git:ssh://github.com/StefanBratanov/jvm-openai.git"
                    url = "https://github.com/StefanBratanov/jvm-openai"
                }
            }
        }
    }
}

signing {
    useInMemoryPgpKeys(System.getenv("SIGNING_KEY"), System.getenv("SIGNING_PASSWORD"))
    sign publishing.publications
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://s01.oss.sonatype.org/service/local/"))
            snapshotRepositoryUrl.set(uri("https://s01.oss.sonatype.org/content/repositories/snapshots/"))
            username = System.getenv("OSSRH_USERNAME")
            password = System.getenv("OSSRH_PASSWORD")
        }
    }
}

spotless {
    java {
        googleJavaFormat()
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "FAILED"
        showStandardStreams = true
        exceptionFormat "full"
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "StefanBratanov_jvm-openai"
        property "sonar.organization", "stefanbratanov"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

task example(type: JavaExec) {
    group = "application"
    description = "Builds and runs the example Java file(s) in the examples folder."
    // Set the directory containing example sources
    def examplesDir = file("$projectDir/examples/src/main/java/examples")
    def outputDir = file("$buildDir/examples-classes")
    def mainJar = file("$buildDir/libs/${project.name}-${project.version}.jar")
    // Compile the main project first (so the jar exists)
    dependsOn jar
    // Compile the example sources
    //classpath: mainJar.exists() ? mainJar.absolutePath : sourceSets.main.runtimeClasspath.asPath
    doFirst {
        ant.mkdir(dir: outputDir)
        ant.javac(
            srcdir: examplesDir,
            destdir: outputDir,
            includeantruntime: false,
            source: '17',
            target: '17',
			classpath: sourceSets.main.runtimeClasspath.asPath
        )
    }
	
    // Set the main class to run
    mainClass.set('examples.ExampleChatClient') // <-- Change to your main class name
    // Set the classpath to include compiled examples and main project classes
	classpath = files(outputDir, mainJar) + files(sourceSets.main.runtimeClasspath)
    // Optional, pass arguments to your example main class
    // args = ['arg1', 'arg2']
}

task allexamples {
    group = "application"
    description = "Builds and runs all example Java files in the examples folder."
    def examplesDir = file("$projectDir/examples/src/main/java")
    def outputDir = file("$buildDir/examples-classes")
    def mainJar = file("$buildDir/libs/${project.name}-${project.version}.jar")
    dependsOn jar
    doFirst {
        ant.mkdir(dir: outputDir)
        ant.javac(
            srcdir: examplesDir,
            destdir: outputDir,
            includeantruntime: false,
            source: '17',
            target: '17',
            classpath: sourceSets.main.runtimeClasspath.asPath
        )
    }
    doLast {
        // Find all .java files in the examplesDir
        def javaFiles = fileTree(examplesDir) {
            include '**/*.java'
        }
        // For each .java file, check if it contains a main method
        javaFiles.each { file ->
            def text = file.text
			//println "working $text"
            if (text =~ /public\s+static\s+void\s+main\s*\(\s*String(\s*\[\s*\]|\s*\.\.\.)\s*\w*\s*\)/) {
			    println "Found main method in $file"
                // Derive the fully qualified class name
                def relPath = file.absolutePath - examplesDir.absolutePath + ''
                relPath = relPath.replace(File.separator, '/')
                if (relPath.startsWith('/')) relPath = relPath.substring(1)
                def className = relPath.replace('.java', '').replace('/', '.')
                // Run the class
                println "\n--- Running example: ${className} ---"
                javaexec {
                    mainClass.set(className)
                    classpath = files(outputDir) + files(sourceSets.main.runtimeClasspath)
                }
            } else println "nothing found"
        }
    }
}